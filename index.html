<meta name="theme-color" content="#0b0e13">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>@font-face{font-family:'Inter';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
</style>
<style>
/* Layout: one phone-width column, sticky header, fixed bottom tab bar; hero day card leads, dashboards below. */
:root{
  color-scheme:dark;
  --bg:#0b0e13; --surface:#131822; --surface-2:#1a2030; --line:#252c3a;
  --fg:#e9edf5; --muted:#8a94a8; --accent:#3ee0c8; --accent-ink:#04110f;
  --hot:#ff8f45; --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --p0:#3ee0c8; --p1:#6c9bff; --p2:#b794f6; --p3:#ff8f45;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:400 15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.col{max-width:640px;margin:0 auto;min-width:0}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--display);font-weight:700;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
svg{display:block}

/* header + nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font:700 26px/1 var(--display);letter-spacing:.02em}
.brand span{color:var(--accent);font:700 26px/1 var(--display)}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font:700 16px var(--display);color:var(--accent)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{display:grid;justify-items:center;gap:3px;padding:7px 0 5px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:500}
nav.tabs button[aria-current=page]{color:var(--accent);background:var(--surface)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card.flat{background:transparent;border:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.sec-h h2{font:700 20px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid color-mix(in srgb,var(--c,var(--muted)) 45%,transparent);color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,var(--muted)) 10%,transparent);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2>*{flex:1 1 140px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:500;background:var(--surface)}
.filters button[aria-pressed=true]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}

/* today hero */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:linear-gradient(160deg,var(--surface-2),var(--surface));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.big{font:700 76px/.82 var(--display);letter-spacing:-.01em}
.big small{display:block;font:600 12px var(--body);letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.hero h1{font:700 26px/1.05 var(--display);margin:8px 0 6px;text-wrap:balance}
.ring-l{font:700 17px var(--display)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .btn{min-width:44px;padding:0 12px}
.daynav .mid{text-align:center;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font:700 30px/1 var(--display);margin-top:4px}
.stat b i{font:500 14px var(--body);color:var(--muted);font-style:normal}

/* checklist */
.item{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid #3a4457;display:grid;place-items:center;color:transparent;transition:.12s}
.item[aria-pressed=true] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item[aria-pressed=true] .t{color:var(--muted)}
.t{padding-top:2px;min-width:0;overflow-wrap:anywhere}
.rx{background:var(--surface-2);border-radius:12px;padding:12px;margin-bottom:6px;display:grid;gap:6px}
.rx b{font-weight:600}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;font-weight:600}
.banner.done{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.banner.skip{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.effort{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.effort button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.effort button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea,input[type=text],input[type=password],input[type=number],input[type=date]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px}
textarea{min-height:84px;resize:vertical}
label{display:grid;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}

/* timer */
.timer{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.tt{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums}
.presets{display:flex;flex-wrap:wrap;gap:6px}

/* plan list */
.wk{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px}
.wk b{font:700 17px var(--display);letter-spacing:.05em;text-transform:uppercase}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.drow{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow.today{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.dn{font:700 24px/1 var(--display);color:var(--c);text-align:center}
.drow .rt{min-width:0}
.drow .rt b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.st.done{background:var(--good);color:#04110a}
.st.skip{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn)}
.st.miss{border:2px solid color-mix(in srgb,var(--bad) 55%,transparent)}
.st.todo{border:2px solid var(--line)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
.cell{aspect-ratio:1/1.08;border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-width:0}
.cell.out{background:transparent;border-color:transparent}
.cell.na{opacity:.45}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .d{font-size:12px;font-weight:600}
.cell .pn{font:700 12px var(--display);color:var(--c);letter-spacing:.03em}
.cell .dot{width:8px;height:8px;border-radius:50%;align-self:flex-end}
.cell.s-done{background:color-mix(in srgb,var(--good) 16%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.cell.s-done .dot{background:var(--good)}
.cell.s-skip .dot{background:var(--warn)}
.cell.s-miss .dot{background:var(--bad)}
.cell.rest .pn{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

/* progress */
.ov{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kv b{display:block;font:700 24px/1.05 var(--display)}
.bar{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c,var(--accent))}
.pr{display:grid;gap:6px}
.pr .l{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.map{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.map button{aspect-ratio:1;border-radius:3px;background:var(--surface-2);border:1px solid transparent}
.map button.done{background:var(--good)}
.map button.skip{background:var(--warn)}
.map button.miss{background:color-mix(in srgb,var(--bad) 45%,var(--surface-2))}
.map button.now{border-color:var(--fg)}
.ms{display:grid;gap:12px}
.ms .g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.delta{color:var(--good);font-weight:600}

/* history */
.mh{font:700 15px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 2px 6px}
.hrow{display:grid;gap:6px;width:100%;text-align:left;padding:13px 14px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .l1{display:flex;justify-content:space-between;gap:10px;align-items:center}
.dots{display:flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--hot)}
.note{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}

/* auth + sheet */
.auth{max-width:420px;margin:0 auto;padding:max(28px,6vh) 0 40px;display:grid;gap:18px}
.auth .logo{font:700 88px/.85 var(--display);letter-spacing:-.01em}
.auth .logo span{color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--fg)}
.err{color:var(--bad);font-size:13.5px;min-height:1px}
.hint{font-size:12.5px;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(3,5,8,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet .p{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:88%;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.sheet .ph{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:90%;font-size:14px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.big{font-size:62px}.hero{gap:10px}}
</style>

<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

g only if comfortable and bar is secure; squat technique; balance practice","2–3 rounds: incline plank 15–20 sec; supported hang 10–20 sec; squat hold 15 sec; single-leg balance 20 sec/side","60 sec","Gentle wrist, shoulder and hip mobility"],["Foundation","Rest","Complete rest","—","Rest. Optional relaxed walk; no structured workout.","No workout","—","—"],["Strength building","A","Full body A – push, legs, core","March in place 1 min; arm circles 20; wrist circles 20; hip hinges 10; easy squats 10","Lower-incline or knee/standard push-ups; bodyweight squats; glute bridges; forearm plank; calf raises","3 sets; 8–12 reps (holds 20–35 sec). Use a slightly harder variation only with clean form.","60–120 sec","Easy breathing 1 min; gentle chest, lat, quad and calf stretches 20 sec each"],["Strength building","Recovery","Active recovery","Not required","Easy walk 20–30 min; gentle shoulder, hip and ankle mobility","Comfortable pace; no hard sets","As needed","Relaxed breathing 2 min"],["Strength building","B","Full body B – pull, legs, core","March 1 min; shoulder rolls 15; scapular squeezes 15; hip circles 10; easy lunges 5/side","Inverted rows; assisted pull-ups or band pulldowns; reverse lunges; dead bugs; side plank","3 sets; 8–12 reps (holds 20–35 sec). Use a slightly harder variation only with clean form.","60–120 sec","Easy breathing 1 min; gentle chest, lat, quad and calf stretches 20 sec each"],["Strength building","Mobility","Mobility and movement quality","Easy walk 3 min","Cat-cow 2 × 8; thoracic rotations 2 × 8/side; wrist rocks 2 × 10; ankle rocks 2 × 10/side; hip flexor stretch 2 × 20 sec/side; shoulder wall slides 2 × 10","2 rounds; gentle range, no pain","30–45 sec","Easy breathing 2 min"],["Strength building","C","Full body C – technique and conditioning","Easy walk 3 min; arm swings 20; ankle rocks 10/side; cat-cow 8; bodyweight good mornings 10","Knee/standard push-ups; rows or assisted pull-ups; step-back lunges; hollow hold; bird dogs","3 sets; 8–1 function splitList(s){const out=[];let d=0,cur='';for(const ch of s){if(ch==='(')d++;if(ch===')')d=Math.max(0,d-1);if(ch===';'&&!d){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out.map(x=>x.trim().replace(/\.$/,'')).filter(Boolean);}
const none=s=>!s||/^(—|-|not required)$/i.test(s.trim());
function sections(day){
  if(day.type==='Rest')return[{id:'m',title:'Rest day',items:['Rest day taken. Optional relaxed walk, no structured workout']}];
  const out=[];
  if(!none(day.warm))out.push({id:'w',title:'Warm-up',items:splitList(day.warm)});
  out.push({id:'m',title:day.type==='Recovery'?'Recovery':day.type==='Mobility'?'Mobility flow':'Main work',items:splitList(day.main)});
  if(!none(day.cool))out.push({id:'c',title:'Cool-down',items:splitList(day.cool)});
  return out;
}

/* ---------- database (IndexedDB, in-memory fallback) ---------- */
const db={persistent:false,idb:null,mem:{users:new Map(),logs:new Map(),ms:new Map()},
  async open(){try{this.idb=await new Promise((res,rej)=>{const r=indexedDB.open('calisthenics120',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('users',{keyPath:'username'});d.createObjectStore('logs',{keyPath:'key'});d.createObjectStore('ms',{keyPath:'key'});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});this.persistent=true;}catch(e){this.persistent=false;}},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.idb.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  get(s,k){return this.persistent?this.tx(s,'readonly',o=>o.get(k)):Promise.resolve(this.mem[s].get(k));},
  all(s){return this.persistent?this.tx(s,'readonly',o=>o.getAll()):Promise.resolve([...this.mem[s].values()]);},
  put(s,v){const k=s==='users'?v.username:v.key;if(!this.persistent){this.mem[s].set(k,v);return Promise.resolve();}return this.tx(s,'readwrite',o=>o.put(v));},
  del(s,k){if(!this.persistent){this.mem[s].delete(k);return Promise.resolve();}return this.tx(s,'readwrite',o=>o.delete(k));}
};

/* ---------- passwords ---------- */
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){
  const enc=new TextEncoder();
  if(globalThis.crypto&&crypto.subtle){
    const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    return 'p1:'+b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},k,256));
  }
  let h=2166136261;const s=salt+pw;for(let r=0;r<2000;r++)for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return 'f1:'+h.toString(16);
}
const newSalt=()=>{const a=new Uint8Array(16);(globalThis.crypto||{getRandomValues:x=>x.map(()=>Math.random()*256)}).getRandomValues(a);return b64(a);};

function streaks(){
  const cur=curDayRaw();let best=0,run=0;
  for(let n=1;n<=TOTAL;n++){if(statusOf(n)==='done'){run++;best=Math.max(best,run);}else run=0;}
  let d=Math.min(cur,TOTAL),now=0;if(d<1)return{now:0,best};
  if(statusOf(d)!=='done'&&d===cur)d--;
  while(d>=1&&statusOf(d)==='done'){now++;d--;}
  return{now,best};
}
function weekStats(w){const ds=DAYS.filter(d=>d&&d.week===w);return{done:ds.filter(d=>statusOf(d.n)==='done').length,total:ds.length};}

    html+=`<button class="drow ${d.n===cur&&curDayRaw()>=1?'today':''}" data-a="open" data-d="${d.n}" id="r${d.n}" style="--c:${phColor(d.phase)}"><span class="dn num">${d.n}</span><span class="rt"><b>${esc(d.focus)}</b><span class="small muted">${fmtDay(d.n)} · ${TYPE_LABEL[d.type]}</span></span>${statusIcon(d.n)}</button>`;

function viewCal(){
  const{calY:y,calM:m}=S;const first=new Date(y,m,1),lead=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const s=parse(S.user.startDate),e=dateOf(TOTAL);
  const canPrev=y*12+m>s.getFullYear()*12+s.getMonth(),canNext=y*12+m<e.getFullYear()*12+e.getMonth();
  let cells='';for(const w of['Mon','Tue','Wed','Thu','Fri','Sat','Sun'])cells+=`<div class="dow">${w}</div>`;
  for(let i=0;i<lead;i++)cells+='<div class="cell out"></div>';
  const tstr=todayStr();
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,m,d),n=dayDiff(S.user.startDate,ymd(dt))+1;
    if(n<1||n>TOTAL){cells+=`<div class="cell na"><span class="d">${d}</span></div>`;continue;}
    const day=DAYS[n],st=statusOf(n),cls=st==='done'?'s-done':st==='skipped'?'s-skip':isMissed(n)?'s-miss':'';
    cells+=`<button class="cell ${cls} ${ymd(dt)===tstr?'today':''} ${day.type==='Rest'?'rest':''}" data-a="open" data-d="${n}" style="--c:${TYPE_COLOR[day.type]}" aria-label="Day ${n}, ${fmt(dt,{day:'numeric',month:'long'})}, ${TYPE_LABEL[day.type]}${st?', '+st:''}"><span class="d num">${d}</span><span class="pn">${day.type.length<=1?day.type:day.type.slice(0,3).toUpperCase()}${''}</span><span style="display:flex;justify-content:space-between;align-items:flex-end"><span class="muted num" style="font-size:10px">D${n}</span><span class="dot"></span></span></button>`;
  }
  const inMonth=DAYS.filter(d=>d&&dateOf(d.n).getFullYear()===y&&dateOf(d.n).getMonth()===m);
  const dn=inMonth.filter(d=>statusOf(d.n)==='done').length;
  return`<div class="daynav"><button class="btn" data-a="cmonth" data-d="-1" aria-label="Previous month" ${canPrev?'':'disabled'}>${ic('left')}</button>
    <div class="mid"><div class="disp" style="font-size:24px">${fmt(first,{month:'long',year:'numeric'})}</div><div class="muted small">${dn} of ${inMonth.length} plan days done</div></div>
    <button class="btn" data-a="cmonth" data-d="1" aria-label="Next month" ${canNext?'':'disabled'}>${ic('right')}</button></div>
  <div class="card" style="padding:10px"><div class="cal">${cells}</div></div>
  <div class="legend"><span><i style="background:var(--good)"></i>Done</span><span><i style="background:var(--warn)"></i>Skipped</span><span><i style="background:var(--bad)"></i>Missed</span><span style="color:var(--accent)">A B C workouts</span><span style="color:var(--hot)">SKI skill</span><span style="color:var(--p1)">MOB / REC</span></div>
  <p class="hint">Day 1 is ${fmt(s,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}. Day 120 is ${fmt(e,{day:'numeric',month:'long',year:'numeric'})}.</p>`;
}

function weekChart(){
  const W=18,bw=14,gap=6,h=70,w=W*(bw+gap),cw=curDayRaw()>=1?DAYS[curDay()].week:0;
  let bars='';
  for(let k=1;k<=W;k++){const ws=weekStats(k),p=ws.total?ws.done/ws.total:0,x=(k-1)*(bw+gap),ph=DAYS.find(d=>d&&d.week===k).phase,bh=Math.max(3,p*h);
    bars+=`<rect x="${x}" y="0" width="${bw}" height="${h}" rx="4" fill="var(--surface-2)"/><rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" rx="4" fill="${p?phColor(ph):'none'}"/>${k===cw?`<rect x="${x-1}" y="-1" width="${bw+2}" height="${h+2}" rx="5" fill="none" stroke="var(--fg)" stroke-width="1.5"/>`:''}<text x="${x+bw/2}" y="${h+14}" text-anchor="middle" font-size="9" fill="var(--muted)">${k}</text>`;}
  return`<div style="overflow-x:auto"><svg viewBox="-2 -3 ${w+2} ${h+22}" width="100%" style="min-width:320px" role="img" aria-label="Share of each week's days completed">${bars}</svg></div>`;
}

  let html='',lastM='';
  rows.forEach(l=>{const d=DAYS[l.day],at=l.at?new Date(l.at):dateOf(l.day),m=fmt(at,{month:'long',year:'numeric'});

function syncHint(){const i=document.getElementById('f-start'),h=document.getElementById('starthint');if(!i||!h)return;const f=()=>{const d=i.value?parse(i.value):null;h.textContent=d?(d.getDay()===1?'Day 1 is a Monday, so the weekly pattern matches the plan (Mon A, Tue recovery, Wed B).':`Day 1 will be a ${fmt(d,{weekday:'long'})}. The plan assumes Monday for Workout A, so weekdays will line up differently.`):'';};i.oninput=f;f();}

/* ---------- actions ---------- */
async function loadUser(u){
  S.user=u;S.logs={};S.ms={};
  (await db.all('logs')).filter(l=>l.uid===u.username).forEach(l=>S.logs[l.day]=l);
  (await db.all('ms')).filter(m=>m.uid===u.username).forEach(m=>S.ms[m.id]=m);
  store.set('c120.session',u.username);
  S.tab='today';S.viewDay=null;
  const c=curDayRaw()>=1&&curDayRaw()<=TOTAL?dateOf(curDay()):parse(u.startDate);S.calY=c.getFullYear();S.calM=c.getMonth();
  render();
}
async function submitAuth(){
  const un=document.getElementById('f-user').value.trim().toLowerCase(),pw=document.getElementById('f-pw').value;
  const fail=m=>{S.authErr=m;document.getElementById('autherr').textContent=m;};
  if(!/^[a-z0-9_.-]{3,24}$/.test(un))return fail('Username needs 3 to 24 letters, numbers, dots, dashes or underscores.');
  if(pw.length<6)return fail('Password needs at least 6 characters.');
  if(S.authMode==='up'){
    if(pw!==document.getElementById('f-pw2').value)return fail('Passwords do not match.');
    const start=document.getElementById('f-start').value;if(!start)return fail('Choose a Day 1 date.');
    if(await db.get('users',un))return fail('That username is taken. Sign in instead, or pick another.');
    const salt=newSalt();const u={username:un,salt,hash:await hashPw(pw,salt),startDate:start,created:new Date().toISOString()};
    await db.put('users',u);S.authErr='';await loadUser(u);toast('Account created. Day 1 is ready.');
  }else{
    const u=await db.get('users',un);
    if(!u||u.hash!==await hashPw(pw,u.salt))return fail('Username or password is incorrect.');
    S.authErr='';await loadUser(u);
  }
}
function openDay(n){S.viewDay=n;S.tab='today';render();window.scrollTo(0,0);}
async function setStatusAfterCheck(n){
  const log=getLog(n),keys=keysOf(DAYS[n]),all=keys.every(k=>log.checks[k]);
  if(all&&log.status!=='done'){log.status='done';log.at=new Date().toISOString();}
  else if(!all&&log.status==='done'){log.status=null;log.at=null;}
}
const ACT={
  authmode(e){S.authMode=e.dataset.m;S.authErr='';render();},
  tab(e){S.tab=e.dataset.t;if(S.tab==='today')S.viewDay=null;render();window.scrollTo(0,0);},
  open(e){openDay(+e.dataset.d);},
  dprev(){S.viewDay=Math.max(1,(S.viewDay??curDay())-1);render();},
  dnext(){S.viewDay=Math.min(TOTAL,(S.viewDay??curDay())+1);render();},
  gotoday(){S.viewDay=null;S.tab='today';render();window.scrollTo(0,0);},
  async chk(e){const n=S.viewDay??curDay(),log=getLog(n);log.checks[e.dataset.k]=!log.checks[e.dataset.k];if(!log.checks[e.dataset.k])delete log.checks[e.dataset.k];const was=log.status;await setStatusAfterCheck(n);render();await saveLog(n);if(log.status==='done'&&was!=='done')toast('Day '+n+' complete. Nice work.');},
  async alldone(){const n=S.viewDay??curDay(),log=getLog(n);keysOf(DAYS[n]).forEach(k=>log.checks[k]=true);log.status='done';log.at=new Date().toISOString();render();await saveLog(n);toast('Day '+n+' complete. Nice work.');},
  async skip(){const n=S.viewDay??curDay(),log=getLog(n);log.status='skipped';log.at=new Date().toISOString();render();await saveLog(n);toast('Day '+n+' skipped');},
  async reopen(){const n=S.viewDay??curDay(),log=getLog(n);log.status=null;log.at=null;render();await saveLog(n);},
  async effort(e){const n=S.viewDay??curDay(),log=getLog(n),v=+e.dataset.v;log.effort=log.effort===v?0:v;render();await saveLog(n);},
  timer(e){timerStart(+e.dataset.s);},timerstop(){timerStop();},
  pf(e){S.planFilter=+e.dataset.f;render();},
  jumptoday(){S.planFilter=-1;S.scrollToday=true;render();},
  hf(e){S.hist=e.dataset.f;render();},
  cmonth(e){const d=new Date(S.calY,S.calM+ +e.dataset.d,1);S.calY=d.getFullYear();S.calM=d.getMonth();render();},
  async savems(e){const id=e.dataset.c,r={key:S.user.username+'|'+id,uid:S.user.username,id,savedAt:new Date().toISOString()};let any=false;
    MS_FIELDS.forEach(([k])=>{const v=document.getElementById(`ms-${id}-${k}`).value;if(v!==''){r[k]=Math.max(0,Math.round(+v));any=true;}});
    if(!any)return toast('Enter at least one result');S.ms[id]=r;await db.put('ms',r);render();toast('Milestone saved');},
  sheet(e){S.sheet=e.dataset.s;S.confirm='';render();},
  closesheet(e,ev){if(ev.target.closest('[data-stop]')&&!ev.target.closest('button[data-a=closesheet]'))return;S.sheet=null;S.confirm='';render();},
  async savestart(){const v=document.getElementById('s-start').value;if(!v)return;S.user.startDate=v;await db.put('users',S.user);S.viewDay=null;const c=dateOf(curDay());S.calY=c.getFullYear();S.calM=c.getMonth();render();toast('Start date updated');},
  async copybackup(){const txt=JSON.stringify({app:'calisthenics120',v:1,startDate:S.user.startDate,logs:Object.values(S.logs),ms:Object.values(S.ms)});
    try{await navigator.clipboard.writeText(txt);toast('Backup copied. Paste it somewhere safe.');}catch(e){const t=document.getElementById('s-restore');t.value=txt;t.select();toast('Select and copy the text shown');}},
  async restore(){await importBackup(document.getElementById('s-restore').value);},
  async installapp(){if(!DEFERRED)return;DEFERRED.prompt();try{await DEFERRED.userChoice;}catch(e){}DEFERRED=null;S.sheet=null;render();},
  logout(){store.del('c120.session');S.user=null;S.sheet=null;S.logs={};S.ms={};render();},
  confdel(){S.confirm='del';render();},
  async delacct(){const un=S.user.username;for(const l of await db.all('logs'))if(l.uid===un)await db.del('logs',l.key);for(const m of await db.all('ms'))if(m.uid===un)await db.del('ms',m.key);await db.del('users',un);ACT.logout();toast('Account deleted');}
};
async function importBackup(txt){
  try{const j=JSON.parse(txt);if(j.app!=='calisthenics120')throw 0;const un=S.user.username;
    for(const l of j.logs||[]){if(!(l.day>=1&&l.day<=TOTAL))continue;const r={key:un+'|'+l.day,uid:un,day:l.day,checks:l.checks||{},status:l.status||null,at:l.at||null,effort:l.effort||0,note:String(l.note||'')};S.logs[l.day]=r;await db.put('logs',r);}
    for(const m of j.ms||[]){const r={...m,key:un+'|'+m.id,uid:un};S.ms[m.id]=r;await db.put('ms',r);}
    if(j.startDate){S.user.startDate=j.startDate;await db.put('users',S.user);}
    S.sheet=null;render();toast('Backup restored');}
  catch(e){toast('That is not a valid backup');}
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=ACT[el.dataset.a];if(!a)return;
  if(el.classList.contains('sheet')&&e.target.closest('[data-stop]'))return;
  a(el,e);
});
document.addEventListener('submit',e=>{if(e.target.id==='authform'){e.preventDefault();submitAuth();}});
let noteT;
document.addEventListener('input',e=>{if(e.target.id==='note'){const n=S.viewDay??curDay(),log=getLog(n);log.note=e.target.value;clearTimeout(noteT);noteT=setTimeout(()=>saveLog(n),400);}});
document.addEventListener('change',e=>{if(e.target.id==='s-file'){const f=e.target.files[0];if(f)f.text().then(importBackup);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render();}});

try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){}
(async()=>{
  await db.open();
  const sess=store.get('c120.session');
  if(sess){const u=await db.get('users',sess);if(u){await loadUser(u);return;}}
  render();
})();
</script>

</body></html>
